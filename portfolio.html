<body class="page-portfolio">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner shell">
      <a class="wordmark" href="index.html" aria-label="ifhjoce.jpeg home">ifhjoce.jpeg</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
        <span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="portfolio.html" aria-current="page">Portfolio</a>
        <a href="about.html">About</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
        <a class="site-nav__instagram" href="https://instagram.com/ifhjoce.jpeg" target="_blank" rel="noreferrer">Instagram</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="portfolio-section shell" aria-labelledby="portfolio-title">
      <h1 class="sr-only" id="portfolio-title">Photography portfolio</h1>
      <div class="filter-chips" role="group" aria-label="Filter portfolio by category">
        <button class="filter-chip is-active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-chip" type="button" data-filter="portraits" aria-pressed="false">Portraits</button>
        <button class="filter-chip" type="button" data-filter="city" aria-pressed="false">City</button>
        <button class="filter-chip" type="button" data-filter="concerts" aria-pressed="false">Concerts</button>
        <button class="filter-chip" type="button" data-filter="nature" aria-pressed="false">Nature</button>
      </div>

      <div class="portfolio-masonry" data-gallery>
        <figure class="gallery-card gallery-card--tall" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open portrait in tall grass">
            <img src="images/gallery-01.jpg" width="900" height="1200" alt="Portrait in tall grass with soft evening haze">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--wide" data-category="concerts">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open live concert photograph">
            <img src="images/gallery-02.jpg" width="1400" height="900" alt="Live musician performing under red and violet lights" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card" data-category="city">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open downtown film photograph">
            <img src="images/gallery-03.jpg" width="1000" height="1000" alt="Downtown street corner photographed on film after sunset" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--tall" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open window light portrait">
            <img src="images/gallery-04.jpg" width="900" height="1300" alt="Close portrait in warm window light with soft shadows" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--wide" data-category="nature">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open wildflower field photograph">
            <img src="images/gallery-05.jpg" width="1400" height="900" alt="Wildflower field glowing beneath a hazy summer sky" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card" data-category="concerts">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open grainy live music photograph">
            <img src="images/gallery-06.jpg" width="1000" height="1000" alt="Grainy live music photograph with bright stage bloom" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--tall" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open seated portrait">
            <img src="images/gallery-07.jpg" width="900" height="1250" alt="Seated outdoor portrait with dreamy analog color" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--wide" data-category="city">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open rainy city street photograph">
            <img src="images/gallery-08.jpg" width="1400" height="900" alt="Rainy city street reflecting amber lights at night" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open editorial portrait">
            <img src="images/gallery-09.jpg" width="1000" height="1000" alt="Editorial portrait framed by leafy branches" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--tall" data-category="concerts">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open concert crowd photograph">
            <img src="images/gallery-10.jpg" width="900" height="1300" alt="Concert crowd beneath green and gold stage light" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--wide" data-category="nature">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open roadside film photograph">
            <img src="images/gallery-11.jpg" width="1400" height="900" alt="Roadside landscape photographed on film near dusk" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open flash portrait">
            <img src="images/gallery-12.jpg" width="1000" height="1000" alt="Direct flash portrait with a playful candid expression" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--tall" data-category="nature">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open forest photograph">
            <img src="images/gallery-13.jpg" width="900" height="1250" alt="Quiet forest path with diffused green light" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--wide" data-category="concerts">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open drummer performance photograph">
            <img src="images/gallery-14.jpg" width="1400" height="900" alt="Drummer performing through smoke and warm stage light" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card" data-category="portraits">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open alley portrait">
            <img src="images/gallery-15.jpg" width="1000" height="1000" alt="Portrait in a downtown alley with faded brick textures" loading="lazy">
          </button>
        </figure>
        <figure class="gallery-card gallery-card--tall" data-category="nature">
          <button class="gallery-card__button" type="button" data-lightbox-trigger aria-label="Open moonlit nature photograph">
            <img src="images/gallery-16.jpg" width="900" height="1300" alt="Moonlit grasses and tree silhouettes with deep film grain" loading="lazy">
          </button>
        </figure>
      </div>
    </section>
  </main>

  <div class="lightbox" data-lightbox hidden>
    <div class="lightbox__backdrop" data-lightbox-backdrop></div>
    <div class="lightbox__dialog" role="dialog" aria-modal="true" aria-label="Expanded photograph">
      <button class="lightbox__close" type="button" data-lightbox-close aria-label="Close lightbox">×</button>
      <button class="lightbox__nav lightbox__nav--prev" type="button" data-lightbox-prev aria-label="Previous photograph">←</button>
      <figure class="lightbox__figure">
        <img data-lightbox-image src="images/gallery-01.jpg" width="1400" height="1800" alt="">
        <figcaption data-lightbox-caption></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" type="button" data-lightbox-next aria-label="Next photograph">→</button>
    </div>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner shell">
      <p><a href="mailto:jocelynnaranjo15@gmail.com">jocelynnaranjo15@gmail.com</a></p>
      <p><a href="https://instagram.com/ifhjoce.jpeg" target="_blank" rel="noreferrer">@ifhjoce.jpeg</a></p>
      <p>© 2026 ifhjoce.jpeg</p>
    </div>
  </footer>
